[project]
name = "fpl-agent"
version = "0.1.0"
description = "Autonomous Fantasy Premier League agent"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
